<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyMoney — Finance Dashboard</title><style>
:root{--green:#087f69;--dark:#17332b;--muted:#778b82;--line:#e4eee8;--bg:#f4f8f6}*{box-sizing:border-box}body{margin:0;background:#e9f0ec;color:var(--dark);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer} .app{max-width:440px;margin:20px auto;min-height:780px;background:var(--bg);border:1px solid var(--line);border-radius:28px;box-shadow:0 16px 50px #1b3e3015;overflow:hidden;position:relative}.content{height:710px;overflow-y:auto;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:13px}.title{font-size:26px;font-weight:850;letter-spacing:-.05em;margin:4px 0}.section{font-size:16px;font-weight:800;margin:23px 0 12px}.hero{background:linear-gradient(120deg,#09816b,#0d5349);border-radius:22px;padding:23px;color:#fff;position:relative;overflow:hidden}.hero:after{content:'';width:190px;height:190px;border-radius:50%;border:1px solid #ffffff35;position:absolute;right:-95px;top:-100px;box-shadow:0 0 0 28px #ffffff0c,0 0 0 55px #ffffff0a;pointer-events:none}.big{font-size:32px;font-weight:850;letter-spacing:-.05em;margin:10px 0 5px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.primary,.soft,.outline{border:0;border-radius:11px;padding:11px 13px;font-size:12px;font-weight:800}.primary{background:var(--green);color:#fff}.soft{background:#e5f5ed;color:var(--green)}.outline{background:#fff;color:var(--dark);border:1px solid var(--line)}.pill{display:inline-block;padding:6px 9px;border-radius:20px;background:#e5f5ed;color:var(--green);font-size:10px;font-weight:800}.icon{width:42px;height:42px;border-radius:13px;background:#e9f6ef;display:grid;place-items:center;font-size:20px;flex-shrink:0}.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.bar{height:8px;background:#e9f1eb;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:var(--green);border-radius:9px}.nav{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:10px 2px 15px}.nav button{background:transparent;border:0;font-size:9px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;padding:5px 0}.nav button.active{color:var(--green)}.nav .sym{font-size:19px}.fab{position:absolute;right:18px;bottom:82px;width:58px;height:58px;background:var(--green);color:#fff;border:3px solid var(--bg);border-radius:19px;font-size:30px;box-shadow:0 8px 20px #087f6945;z-index:3}.overlay{position:absolute;inset:0;background:#0c2b2299;z-index:5;display:flex;align-items:flex-end}.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;padding:21px;max-height:92%;overflow-y:auto}.sheet h3{margin:0;font-size:19px}.sheet label{display:block;font-size:12px;font-weight:750;margin:13px 0 6px}.sheet input,.sheet select{width:100%;padding:12px;border-radius:11px;border:1px solid #dce8e1;background:#fff;color:var(--dark);font-size:13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.actions button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 6px;font-size:12px;font-weight:750;display:flex;flex-direction:column;gap:9px;align-items:center}.actions span{font-size:24px}.notice{font-size:11px;line-height:1.5;background:#e6f5ed;color:#12644f;border-radius:10px;padding:11px;margin-top:12px}.toast{position:absolute;bottom:87px;left:50%;transform:translateX(-50%);background:#18382d;color:white;padding:11px 15px;border-radius:11px;font-size:12px;z-index:10;text-align:center;white-space:nowrap}.chart{display:flex;align-items:flex-end;justify-content:space-around;height:120px;gap:14px;margin-top:15px}.chart>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;gap:8px}.chart i{display:block;width:100%;max-width:28px;background:#b6dfd0;border-radius:7px 7px 3px 3px}.chart>div:last-child i{background:var(--green)}@media(max-width:500px){body{background:var(--bg)}.app{max-width:none;margin:0;border:0;border-radius:0;min-height:100dvh}.content{height:calc(100dvh - 75px)}.nav button{font-size:8px}}

/* Hide visible scrollbars while keeping touch, wheel, and keyboard scrolling. */
html, body, .screen, .sheet, * { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar, .screen::-webkit-scrollbar, .sheet::-webkit-scrollbar, *::-webkit-scrollbar { display: none; width: 0; height: 0; }
</style></head><body><div class="app"><main class="content" id="content"></main><button class="fab" id="fab" aria-label="Add">+</button><nav class="nav" id="nav"></nav><div id="overlay"></div></div><script>
'use strict';
const STORE='mymoney_prototype_v6';const DEMO_DATE='2026-10-17';
const initial=()=>({date:DEMO_DATE,accounts:[{id:1,name:'HDFC Savings',type:'bank',opening:124580},{id:2,name:'ICICI Savings',type:'bank',opening:42850},{id:3,name:'Cash Wallet',type:'cash',opening:4200}],cards:[{id:11,name:'HDFC Millennia',opening:12000,statementDay:18,dueDay:5},{id:12,name:'HDFC Swiggy',opening:4000,statementDay:25,dueDay:12}],limit:100000,emis:[{id:21,name:'Laptop EMI',amount:2499,day:20,account:1,category:'Shopping',start:'2026-10',months:12},{id:22,name:'Bike EMI',amount:4200,day:5,account:2,category:'Transport',start:'2026-10',months:18}],budgets:[{name:'Food',limit:12000,icon:'🍜'},{name:'Shopping',limit:10000,icon:'🛍️'},{name:'Transport',limit:6000,icon:'🚕'},{name:'Utilities',limit:5000,icon:'⚡'}],goals:[{id:31,name:'Emergency Fund',saved:72000,target:150000,icon:'🛡️'},{id:32,name:'Goa Vacation',saved:18500,target:40000,icon:'🏖️'}],tx:[{id:41,type:'expense',amount:2450,source:1,method:'UPI',category:'Food',note:'Groceries',date:'2026-10-16'},{id:42,type:'expense',amount:385,source:2,method:'Debit Card',category:'Transport',note:'Uber ride',date:'2026-10-15'},{id:43,type:'income',amount:85000,target:1,note:'Monthly salary',date:'2026-10-14'},{id:44,type:'expense',amount:1890,source:11,method:'Credit Card',category:'Utilities',note:'Electricity bill',date:'2026-10-13'}],bills:[],processed:[],reminders:[7,3,1,0]});
let state;try{state=JSON.parse(localStorage.getItem(STORE))||initial()}catch(e){state=initial()}let tab='home';let nextId=()=>Date.now()+Math.floor(Math.random()*100000);const el=id=>document.getElementById(id),fmt=n=>'₹'+Math.abs(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ac=id=>state.accounts.find(x=>x.id===Number(id)),cc=id=>state.cards.find(x=>x.id===Number(id)),who=id=>ac(id)?.name||cc(id)?.name||'Unknown';const ym=d=>d.slice(0,7),nextMonth=m=>{const [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,7)},dueDate=(m,d)=>{const [y,mo]=m.split('-').map(Number);return m+'-'+String(Math.min(d,new Date(Date.UTC(y,mo,0)).getUTCDate())).padStart(2,'0')};
const bal=a=>state.tx.reduce((n,t)=>n+(t.target===a.id&&['income','transfer','withdrawal'].includes(t.type)?t.amount:0)-(t.source===a.id&&['expense','transfer','withdrawal','payment'].includes(t.type)?t.amount:0),a.opening);
const outstanding=c=>state.tx.reduce((n,t)=>n+(t.type==='expense'&&t.source===c.id?t.amount:0)-(t.type==='payment'&&t.target===c.id?t.amount:0),c.opening);const used=()=>state.cards.reduce((n,c)=>n+outstanding(c),0),credit=()=>state.limit-used(),total=()=>state.accounts.reduce((n,a)=>n+bal(a),0);const expenses=()=>state.tx.filter(t=>t.type==='expense'&&ym(t.date)===ym(state.date)).reduce((n,t)=>n+t.amount,0);const spent=cat=>state.tx.filter(t=>t.type==='expense'&&t.category===cat&&ym(t.date)===ym(state.date)).reduce((n,t)=>n+t.amount,0);const billLeft=b=>Math.max(0,b.amount-state.tx.filter(t=>t.billId===b.id&&t.type==='payment').reduce((n,t)=>n+t.amount,0));
const pct=(v,max)=>'<div class="bar"><div style="width:'+Math.max(0,Math.min(100,max?v/max*100:0))+'%"></div></div>';const head=(title,sub)=>'<div class="top"><div><div class="tiny muted" style="font-weight:800;letter-spacing:.1em">'+sub+'</div><div class="title">'+title+'</div></div><button class="soft" data-tab="settings">⚙</button></div>';const sec=(title,action='')=>'<div class="row"><div class="section">'+title+'</div>'+action+'</div>';
function txline(t){const ico={expense:'🛍️',income:'💰',transfer:'🔁',withdrawal:'🏧',payment:'💳'}[t.type];return '<div class="item"><div class="icon">'+ico+'</div><div style="flex:1;min-width:0"><b class="small">'+esc(t.note)+'</b><div class="tiny muted" style="margin-top:5px">'+esc(t.type==='expense'?t.method+' · '+who(t.source):t.type==='income'?'To '+who(t.target):who(t.source)+' → '+who(t.target))+' · '+t.date+'</div></div><b class="small" style="color:'+(t.type==='income'?'var(--green)':'inherit')+'">'+(t.type==='income'?'+':t.type==='expense'?'−':'')+fmt(t.amount)+'</b></div>'}
function chart(){return '<div class="chart">'+[46,68,39,77,62,85,57].map((h,i)=>'<div><i style="height:'+h+'%"></i><span class="tiny muted">'+['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]+'</span></div>').join('')+'</div>'}
function home(){return '<div class="top"><div class="row"><div class="icon" style="font-weight:900;color:var(--green)">M</div><div><div class="small muted">Welcome back 👋</div><b style="font-size:19px">MyMoney</b></div></div><button class="soft" data-tab="settings">⚙</button></div><div class="hero"><div class="small" style="opacity:.8">Total available balance</div><div class="big">'+fmt(total())+'</div><div class="small" style="opacity:.8">Across '+state.accounts.length+' accounts</div><div class="row" style="justify-content:flex-start;margin-top:22px"><button class="primary" style="background:#ffffff26;border:1px solid #ffffff55" data-action="expense">＋ Add transaction</button><button class="primary" style="background:#ffffff26;border:1px solid #ffffff55" data-tab="accounts">Accounts →</button></div></div><div class="grid" style="margin-top:11px"><div class="card"><div class="tiny muted">↗ Income</div><b style="font-size:20px;color:var(--green)">'+fmt(state.tx.filter(t=>t.type==='income'&&ym(t.date)===ym(state.date)).reduce((n,t)=>n+t.amount,0))+'</b></div><div class="card"><div class="tiny muted">↘ Expenses</div><b style="font-size:20px">'+fmt(expenses())+'</b></div></div>'+sec('Spending overview','<span class="pill">'+ym(state.date)+'</span>')+'<div class="card"><div class="tiny muted">Illustrative monthly trend</div><b style="font-size:23px">'+fmt(expenses())+'</b>'+chart()+'</div>'+sec('Shared credit','<button class="soft" data-tab="cards">View cards →</button>')+'<div class="card"><div class="row"><div><div class="tiny muted">Available credit</div><b style="font-size:23px">'+fmt(credit())+'</b></div><span class="pill">'+state.cards.length+' cards</span></div><div style="margin-top:13px">'+pct(used(),state.limit)+'</div><div class="tiny muted" style="margin-top:8px">'+fmt(used())+' used of '+fmt(state.limit)+'</div></div>'+sec('Upcoming EMIs','<button class="soft" data-tab="emis">See all →</button>')+'<div class="card">'+state.emis.slice(0,2).map(e=>'<div class="item"><div class="icon">📅</div><div style="flex:1"><b class="small">'+esc(e.name)+'</b><div class="tiny muted">Day '+e.day+' · '+esc(who(e.account))+'</div></div><b class="small">'+fmt(e.amount)+'</b></div>').join('')+'</div>'+sec('Recent activity','<button class="soft" data-tab="activity">View all →</button>')+'<div class="card">'+state.tx.slice().reverse().slice(0,4).map(txline).join('')+'</div>'+sec('Budget health','<button class="soft" data-tab="budgets">Budgets →</button>')+'<div class="card">'+state.budgets.slice(0,2).map(b=>'<div style="margin-bottom:15px"><div class="row small" style="margin-bottom:8px"><b>'+b.icon+' '+esc(b.name)+'</b><span class="muted">'+fmt(spent(b.name))+' / '+fmt(b.limit)+'</span></div>'+pct(spent(b.name),b.limit)+'</div>').join('')+'</div>'}
function accounts(){return head('Accounts','YOUR MONEY, ORGANIZED')+'<div class="hero"><div class="small" style="opacity:.8">Total balance</div><div class="big">'+fmt(total())+'</div></div>'+sec('Your accounts')+state.accounts.map(a=>'<div class="card row"><div class="row"><div class="icon">'+(a.type==='cash'?'👛':'🏦')+'</div><div><b class="small">'+esc(a.name)+'</b><div class="tiny muted">'+(a.type==='cash'?'Cash wallet':'Bank account')+'</div></div></div><b class="small">'+fmt(bal(a))+'</b></div>').join('')+'<button class="primary" style="width:100%" data-action="addAccount">＋ Add account</button>'}
function cards(){return head('Credit cards','ONE SHARED CREDIT LIMIT')+'<div class="hero"><div class="small" style="opacity:.8">Available credit</div><div class="big">'+fmt(credit())+'</div><div class="small" style="opacity:.8">'+fmt(used())+' used of '+fmt(state.limit)+'</div></div><div class="grid" style="margin-top:12px"><button class="soft" data-action="limit">Edit limit</button><button class="primary" data-action="addCard">＋ Link card</button></div>'+sec('Linked cards')+state.cards.map(c=>'<div class="card"><div class="row"><div class="row"><div class="icon">💳</div><div><b class="small">'+esc(c.name)+'</b><div class="tiny muted">Statement '+c.statementDay+' · Due '+c.dueDay+'</div></div></div><span class="pill">Shared</span></div><div class="row" style="margin:16px 0"><div><div class="tiny muted">Outstanding</div><b>'+fmt(outstanding(c))+'</b></div><div><div class="tiny muted">Unpaid bills</div><b>'+fmt(state.bills.filter(b=>b.cardId===c.id).reduce((n,b)=>n+billLeft(b),0))+'</b></div></div><div class="row"><button class="soft" data-statement="'+c.id+'">Generate bill</button><button class="outline" data-editcard="'+c.id+'">Edit dates</button></div></div>').join('')+sec('Bills')+(state.bills.length?state.bills.slice().reverse().map(b=>'<div class="card"><div class="row"><div><b class="small">'+esc(who(b.cardId))+'</b><div class="tiny muted">Due '+b.dueDate+'</div></div><b>'+fmt(billLeft(b))+'</b></div><button class="soft" style="margin-top:11px" data-pay="'+b.id+'">Pay bill</button></div>').join(''):'<div class="card small muted">No generated bills yet.</div>')}
function activity(){return head('Transactions','YOUR FINANCIAL TIMELINE')+'<div class="grid"><button class="primary" data-action="expense">＋ Expense</button><button class="soft" data-action="income">＋ Income</button><button class="outline" data-action="withdrawal">🏧 ATM cash</button><button class="outline" data-action="transfer">⇄ Transfer</button></div>'+sec('All activity','<span class="pill">'+state.tx.length+' entries</span>')+'<div class="card">'+state.tx.slice().reverse().map(txline).join('')+'</div>'}
function emis(){return head('EMIs','SCHEDULED AUTO-DEBITS')+'<div class="card"><div class="small muted">Monthly commitments</div><div style="font-size:26px;font-weight:850">'+fmt(state.emis.reduce((n,e)=>n+e.amount,0))+'</div></div><div class="grid"><button class="primary" data-action="addEmi">＋ Add EMI</button><button class="soft" data-action="runEmi">Process due EMIs</button></div>'+sec('Schedules')+state.emis.map(e=>{const key=e.id+'|'+ym(state.date);return '<div class="card"><div class="row"><div class="row"><div class="icon">📅</div><div><b class="small">'+esc(e.name)+'</b><div class="tiny muted">Day '+e.day+' · '+esc(who(e.account))+'</div></div></div><span class="pill">'+(state.processed.includes(key)?'Debited':dueDate(ym(state.date),e.day)<=state.date?'Due / pending':'Scheduled')+'</span></div><div style="font-size:23px;font-weight:850;margin:13px 0">'+fmt(e.amount)+'</div><div class="small muted">'+esc(e.category)+' · '+e.months+' installments from '+e.start+'</div></div>'}).join('')+'<div class="card"><label style="display:block;margin-bottom:8px;font-size:12px">Simulate date</label><input id="simdate" type="date" min="'+state.date+'" value="'+state.date+'" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px"><button class="primary" data-action="runEmi" style="width:100%;margin-top:12px">Run scheduled debits</button><div class="tiny muted" style="margin-top:9px">Simulation only; no actual bank debit occurs.</div></div>'}
function budgets(){const limit=state.budgets.reduce((n,b)=>n+b.limit,0),value=state.budgets.reduce((n,b)=>n+spent(b.name),0);return head('Budgets','SPEND WITH INTENTION')+'<div class="card"><div class="tiny muted">Monthly budget usage</div><div class="row" style="margin:12px 0"><b style="font-size:24px">'+fmt(value)+'</b><span class="small muted">of '+fmt(limit)+'</span></div>'+pct(value,limit)+'</div>'+sec('Category budgets','<button class="soft" data-action="addBudget">＋ Add budget</button>')+state.budgets.map(b=>'<div class="card"><div class="row"><b class="small">'+b.icon+' '+esc(b.name)+'</b><span class="pill">'+Math.round(spent(b.name)/b.limit*100)+'%</span></div><div class="row small" style="margin:13px 0 9px"><b>'+fmt(spent(b.name))+'</b><span class="muted">of '+fmt(b.limit)+'</span></div>'+pct(spent(b.name),b.limit)+'<button class="soft" style="margin-top:12px" data-budget="'+esc(b.name)+'">Edit limit</button></div>').join('')}
function goals(){return head('Savings goals','BUILD YOUR FUTURE')+'<div class="card"><div class="small muted">Total saved</div><b style="font-size:26px">'+fmt(state.goals.reduce((n,g)=>n+g.saved,0))+'</b></div>'+sec('Your goals','<button class="soft" data-action="addGoal">＋ Add goal</button>')+state.goals.map(g=>'<div class="card"><div class="row"><div class="row"><div class="icon">'+g.icon+'</div><b class="small">'+esc(g.name)+'</b></div><span class="pill">'+Math.round(g.saved/g.target*100)+'%</span></div><div class="row small" style="margin:14px 0 9px"><b>'+fmt(g.saved)+'</b><span class="muted">of '+fmt(g.target)+'</span></div>'+pct(g.saved,g.target)+'<button class="soft" style="margin-top:12px" data-goal="'+g.id+'">＋ Add savings</button></div>').join('')}
function reports(){return head('Reports','UNDERSTAND YOUR SPENDING')+'<div class="card"><div class="tiny muted">Expenses this month</div><b style="font-size:26px">'+fmt(expenses())+'</b>'+chart()+'</div>'+sec('Category spending')+'<div class="card">'+state.budgets.map(b=>'<div style="margin:12px 0"><div class="row small" style="margin-bottom:8px"><b>'+b.icon+' '+esc(b.name)+'</b><span>'+fmt(spent(b.name))+'</span></div>'+pct(spent(b.name),Math.max(1,...state.budgets.map(x=>spent(x.name))))+'</div>').join('')+'</div>'+sec('Credit utilization')+'<div class="card"><div class="row"><b>'+fmt(used())+'</b><span class="small muted">of '+fmt(state.limit)+'</span></div><div style="margin-top:12px">'+pct(used(),state.limit)+'</div></div>'}
function settings(){return head('Settings','PERSONALIZE MYMONEY')+'<div class="card"><div class="row small"><span>Currency</span><b>INR · ₹</b></div><div class="row small" style="margin-top:16px"><span>Simulation date</span><b>'+state.date+'</b></div><div class="row small" style="margin-top:16px"><span>Credit model</span><b>Shared limit</b></div><div class="row small" style="margin-top:16px"><span>Data storage</span><b>Local browser</b></div></div>'+sec('Bill reminders')+'<div class="card"><div class="small muted" style="margin-bottom:12px">Select reminder days (preferences only)</div><div class="row" style="flex-wrap:wrap;justify-content:flex-start">'+[7,3,1,0].map(d=>'<button class="'+(state.reminders.includes(d)?'primary':'outline')+'" data-remind="'+d+'">'+(d===0?'Due day':d+' days')+'</button>').join('')+'</div></div><div class="card"><div class="small muted">Demo data is saved in this browser. Background notifications and actual bank payments are not supported.</div><button class="soft" style="width:100%;margin-top:14px" data-action="reset">Reset sample data</button></div>'}
const views={home,accounts,cards,activity,emis,budgets,goals,reports,settings};const tabs=[['home','⌂','Home'],['accounts','▣','Accounts'],['cards','▤','Cards'],['activity','☷','Activity'],['emis','▦','EMIs'],['budgets','▥','Budgets'],['goals','◎','Goals'],['reports','▥','Reports']];function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}function render(){el('content').innerHTML=views[tab]();el('nav').innerHTML=tabs.map(([id,icon,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'"><span class="sym">'+icon+'</span>'+label+'</button>').join('');save()}
function toast(msg){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.textContent=msg;document.querySelector('.app').appendChild(node);setTimeout(()=>node.remove(),2300)}function close(){el('overlay').innerHTML=''}function modal(title,fields,onSave,submit='Save'){el('overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="row"><h3>'+title+'</h3><button class="outline" type="button" data-action="close">✕</button></div><form id="form">'+fields+'<button type="submit" class="primary" style="width:100%;margin-top:19px">'+submit+'</button></form></div></div>';el('form').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.currentTarget))}}const amount=(value='')=>'<label>Amount (₹)</label><input type="number" name="amount" min="0.01" step="0.01" value="'+value+'" required>';const opts=(types=['bank','cash'])=>state.accounts.filter(a=>types.includes(a.type)).map(a=>'<option value="'+a.id+'">'+esc(a.name)+' · '+fmt(bal(a))+'</option>').join('');
function expense(){modal('Add expense',amount()+'<label>Payment method</label><select name="method" id="method"><option>UPI</option><option>Debit Card</option><option>Credit Card</option><option>Cash</option><option>Net Banking</option></select><div id="sourcebox"></div><label>Category</label><select name="category">'+state.budgets.map(b=>'<option>'+esc(b.name)+'</option>').join('')+'</select><label>Description</label><input name="note" required maxlength="100" placeholder="e.g. Groceries">',f=>{const n=Number(f.get('amount')),method=String(f.get('method')),src=Number(f.get('source'));if(n<=0)return;if(method==='Credit Card'){if(!cc(src)||credit()<n)return toast('Insufficient shared credit')}else if(!ac(src)||bal(ac(src))<n)return toast('Insufficient balance');state.tx.push({id:nextId(),type:'expense',amount:n,source:src,method,category:String(f.get('category')),note:String(f.get('note')),date:state.date});close();render();toast('Expense saved')});const m=el('method'),box=el('sourcebox');function refresh(){box.innerHTML='<label>'+(m.value==='Credit Card'?'Credit card':m.value==='Cash'?'Cash wallet':'Bank account')+'</label><select name="source">'+(m.value==='Credit Card'?state.cards.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join(''):opts(m.value==='Cash'?['cash']:['bank']))+'</select>'}m.onchange=refresh;refresh()}
function income(){modal('Add income',amount()+'<label>Receive into</label><select name="target">'+opts()+'</select><label>Description</label><input name="note" required value="Income">',f=>{state.tx.push({id:nextId(),type:'income',amount:Number(f.get('amount')),target:Number(f.get('target')),note:String(f.get('note')),date:state.date});close();render();toast('Income saved')})}
function transfer(kind){modal(kind==='withdrawal'?'ATM withdrawal':'Transfer money',amount()+'<label>From account</label><select name="source">'+opts(kind==='withdrawal'?['bank']:['bank','cash'])+'</select><label>To account</label><select name="target">'+opts(kind==='withdrawal'?['cash']:['bank','cash'])+'</select><div class="notice">Account transfers do not count as expenses.</div>',f=>{const n=Number(f.get('amount')),src=Number(f.get('source')),dst=Number(f.get('target'));if(src===dst)return toast('Choose different accounts');if(!ac(src)||!ac(dst)||n<=0||bal(ac(src))<n)return toast('Insufficient balance');state.tx.push({id:nextId(),type:kind,amount:n,source:src,target:dst,note:kind==='withdrawal'?'ATM withdrawal':'Own-account transfer',date:state.date});close();render();toast('Transfer recorded')})}
function addAccount(){modal('Add account','<label>Account name</label><input name="name" required placeholder="e.g. SBI Savings"><label>Type</label><select name="type"><option value="bank">Bank</option><option value="cash">Cash wallet</option></select><label>Opening balance</label><input name="opening" type="number" min="0" step=".01" value="0" required>',f=>{state.accounts.push({id:nextId(),name:String(f.get('name')),type:String(f.get('type')),opening:Number(f.get('opening'))});close();render();toast('Account added')})}
function addCard(){modal('Link credit card','<label>Card name</label><input name="name" required><div class="grid"><div><label>Statement day</label><input name="statement" type="number" min="1" max="28" value="18" required></div><div><label>Due day</label><input name="due" type="number" min="1" max="28" value="5" required></div></div><label>Opening outstanding</label><input name="opening" type="number" min="0" step=".01" value="0" required>',f=>{const opening=Number(f.get('opening'));if(opening>credit())return toast('Shared limit exceeded');state.cards.push({id:nextId(),name:String(f.get('name')),opening,statementDay:Number(f.get('statement')),dueDay:Number(f.get('due'))});close();render();toast('Card linked')})}
function limit(){modal('Edit shared limit','<label>Shared credit limit (₹)</label><input name="limit" type="number" min="0" step=".01" value="'+state.limit+'" required>',f=>{const n=Number(f.get('limit'));if(n<used())return toast('Limit below outstanding');state.limit=n;close();render();toast('Limit updated')})}
function editCard(id){const c=cc(id);if(!c)return;modal('Billing dates','<div class="small">'+esc(c.name)+'</div><div class="grid"><div><label>Statement day</label><input name="statement" type="number" min="1" max="28" value="'+c.statementDay+'" required></div><div><label>Due day</label><input name="due" type="number" min="1" max="28" value="'+c.dueDay+'" required></div></div>',f=>{c.statementDay=Number(f.get('statement'));c.dueDay=Number(f.get('due'));close();render();toast('Dates updated')})}
function statement(id){const c=cc(id);if(!c)return;const date=dueDate(ym(state.date),c.statementDay);if(date>state.date)return toast('Statement date not reached');if(state.bills.some(b=>b.cardId===id&&b.statementDate===date))return toast('Statement already exists');const amount=Math.max(0,outstanding(c));const dueYM=c.dueDay<=c.statementDay?nextMonth(ym(state.date)):ym(state.date);modal('Generate bill','<div class="card"><b>'+esc(c.name)+'</b><div class="small muted" style="margin-top:9px">Statement date: '+date+'</div><div class="row" style="margin-top:12px"><span>Current outstanding*</span><b>'+fmt(amount)+'</b></div><div class="row" style="margin-top:9px"><span>Due date</span><b>'+dueDate(dueYM,c.dueDay)+'</b></div></div><div class="notice">Simplified billing preview; historical statement allocation and interest are not modeled.</div>',()=>{state.bills.push({id:nextId(),cardId:id,amount,statementDate:date,dueDate:dueDate(dueYM,c.dueDay)});close();render();toast('Bill generated')},'Generate bill')}
function pay(id){const b=state.bills.find(x=>x.id===id);if(!b)return;const rem=billLeft(b);if(rem<=0)return toast('Bill already paid');modal('Pay credit card bill','<div class="small">'+esc(who(b.cardId))+' · '+fmt(rem)+' unpaid</div><label>Debit bank account</label><select name="source">'+opts(['bank'])+'</select>'+amount(rem)+'<div class="notice">Bill payment restores credit and is not counted as a new expense.</div>',f=>{const n=Number(f.get('amount')),src=Number(f.get('source'));if(n<=0||n>billLeft(b)||n>outstanding(cc(b.cardId)))return toast('Invalid payment amount');if(!ac(src)||bal(ac(src))<n)return toast('Insufficient bank balance');state.tx.push({id:nextId(),type:'payment',amount:n,source:src,target:b.cardId,billId:b.id,note:'Credit card bill payment',date:state.date});close();render();toast('Payment recorded')})}
function addEmi(){modal('Schedule EMI','<label>EMI name</label><input name="name" required placeholder="e.g. Phone EMI"><div class="grid"><div>'+amount()+'</div><div><label>Debit day</label><input name="day" type="number" min="1" max="31" value="5" required></div></div><label>Auto-debit bank account</label><select name="account">'+opts(['bank'])+'</select><label>Expense category</label><select name="category">'+state.budgets.map(b=>'<option>'+esc(b.name)+'</option>').join('')+'</select><div class="grid"><div><label>Start month</label><input name="start" type="month" value="'+ym(state.date)+'" required></div><div><label>Installments</label><input name="months" type="number" min="1" value="12" required></div></div>',f=>{state.emis.push({id:nextId(),name:String(f.get('name')),amount:Number(f.get('amount')),day:Number(f.get('day')),account:Number(f.get('account')),category:String(f.get('category')),start:String(f.get('start')),months:Number(f.get('months'))});close();render();toast('EMI scheduled')})}
function runEmi(){const d=el('simdate')?.value||state.date;if(d<state.date)return toast('Choose a valid date');state.date=d;let done=0,skipped=0;const due=[];for(const e of state.emis){let m=e.start;for(let i=0;i<e.months&&m<=ym(d);i++,m=nextMonth(m)){const key=e.id+'|'+m;if(state.processed.includes(key)||dueDate(m,e.day)>d)continue;due.push({e,key,date:dueDate(m,e.day)})}}due.sort((a,b)=>a.date.localeCompare(b.date)||a.e.id-b.e.id);for(const item of due){const a=ac(item.e.account);if(!a||bal(a)<item.e.amount){skipped++;continue}state.tx.push({id:nextId(),type:'expense',amount:item.e.amount,source:a.id,method:'EMI Auto-debit',category:item.e.category,note:item.e.name,date:item.date});state.processed.push(item.key);done++}render();toast(done+' debited · '+skipped+' pending')}
function addBudget(){modal('Add budget','<label>Category</label><input name="name" required placeholder="e.g. Health"><label>Monthly limit</label><input name="limit" type="number" min="1" required>',f=>{const name=String(f.get('name')).trim();if(state.budgets.some(b=>b.name.toLowerCase()===name.toLowerCase()))return toast('Category already exists');state.budgets.push({name,limit:Number(f.get('limit')),icon:'📊'});close();render();toast('Budget added')})}
function editBudget(name){const b=state.budgets.find(x=>x.name===name);if(!b)return;modal('Edit budget','<div class="small">'+esc(b.name)+'</div><label>Monthly limit</label><input name="limit" type="number" min="1" value="'+b.limit+'" required>',f=>{b.limit=Number(f.get('limit'));close();render();toast('Budget updated')})}
function addGoal(){modal('Add savings goal','<label>Goal name</label><input name="name" required><label>Target amount</label><input name="target" type="number" min="1" required><label>Already saved</label><input name="saved" type="number" min="0" value="0" required>',f=>{state.goals.push({id:nextId(),name:String(f.get('name')),target:Number(f.get('target')),saved:Number(f.get('saved')),icon:'🎯'});close();render();toast('Goal added')})}
function addSavings(id){const g=state.goals.find(x=>x.id===id);if(!g)return;modal('Add goal savings','<div class="small">'+esc(g.name)+'</div>'+amount(),f=>{g.saved+=Number(f.get('amount'));close();render();toast('Savings added')})}
function quick(){el('overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="row"><h3>Quick actions</h3><button class="outline" data-action="close">✕</button></div><div class="actions">'+[['expense','🛍️','Expense'],['income','💰','Income'],['transfer','🔁','Transfer'],['withdrawal','🏧','ATM cash'],['addEmi','📅','Add EMI'],['addCard','💳','Add card'],['addBudget','📊','Budget'],['addGoal','🎯','Goal'],['addAccount','🏦','Account']].map(([a,i,l])=>'<button data-action="'+a+'"><span>'+i+'</span>'+l+'</button>').join('')+'</div></div></div>'}
document.querySelector('.app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.tab){tab=d.tab;render();el('content').scrollTop=0;return}if(d.statement){statement(Number(d.statement));return}if(d.editcard){editCard(Number(d.editcard));return}if(d.pay){pay(Number(d.pay));return}if(d.budget){editBudget(d.budget);return}if(d.goal){addSavings(Number(d.goal));return}if(d.remind!==undefined){const n=Number(d.remind);state.reminders=state.reminders.includes(n)?state.reminders.filter(x=>x!==n):[...state.reminders,n];render();return}switch(d.action){case'quick':quick();break;case'close':close();break;case'expense':expense();break;case'income':income();break;case'transfer':transfer('transfer');break;case'withdrawal':transfer('withdrawal');break;case'addAccount':addAccount();break;case'addCard':addCard();break;case'limit':limit();break;case'addEmi':addEmi();break;case'runEmi':runEmi();break;case'addBudget':addBudget();break;case'addGoal':addGoal();break;case'reset':state=initial();tab='home';close();render();toast('Sample data reset');break}});el('fab').addEventListener('click',quick);render();
</script></body></html>
